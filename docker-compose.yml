services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zimfundi
      POSTGRES_USER: zimfundi
      POSTGRES_PASSWORD: zimfundi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zimfundi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    # -Q must list every queue named in CELERY_TASK_ROUTES (config/settings.py)
    # plus the "celery" default -- without it Celery only consumes the
    # default queue, so apps.whatsapp/.ai_tutor/.analytics/.billing tasks
    # (routed to their own named queues) enqueue fine and then sit
    # unconsumed in Redis forever, with no error anywhere.
    command: celery -A config worker -l info -Q celery,whatsapp,ai,analytics,billing
    depends_on:
      - backend

  celery_beat:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    command: celery -A config beat -l info
    depends_on:
      - backend

volumes:
  postgres_data:
