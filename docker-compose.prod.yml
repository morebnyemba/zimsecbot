services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zimfundi}
      POSTGRES_USER: ${POSTGRES_USER:-zimfundi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zimfundi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"
    healthcheck:
      # Without this, `docker compose up --wait` (and celery/nginx's
      # depends_on below) has nothing to gate on — a backend that's up but
      # can't reach postgres (e.g. a DB-password mismatch, as happened on
      # 2026-09-01) looked identical to a healthy one to `docker compose ps`
      # until someone read the logs by hand.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=10).read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery_worker:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - media_data:/app/media
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A config worker -l info

  celery_beat:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A config beat -l info

  nginx:
    image: nginx:1.27-alpine
    container_name: zimfundi_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://127.0.0.1/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  default:
  edge:
    external: true
