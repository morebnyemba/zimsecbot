upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /health/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # See the comment on the "/" location below re: X-Forwarded-Proto.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        access_log off;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NOT $scheme: this server only ever receives plain HTTP from bubi's
        # front nginx (TLS already terminated there), so $scheme here is
        # always "http" regardless of what the original client used -- using
        # it clobbers the X-Forwarded-Proto: https that bubi's nginx already
        # set correctly, before Django ever sees it. With SECURE_SSL_REDIRECT
        # (on whenever DEBUG=False) reading that same header, every request
        # looked like plain HTTP and got redirected to itself forever
        # (ERR_TOO_MANY_REDIRECTS). Forward what was actually received
        # instead of resetting it to this hop's own connection scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
